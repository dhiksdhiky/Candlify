name: Glory Engine Harvester

on:
  schedule:
    # Berjalan tiap jam 11:17 UTC (18:17 WIB), dari Senin sampai Jumat (Menghindari load/delay di menit 0)
    - cron: '17 11 * * 1-5'
  workflow_dispatch: # Mengizinkan eksekusi manual via tab Actions

concurrency:
  group: glory-harvester
  cancel-in-progress: true

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Timeout job total maksimal 6 jam
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r worker/requirements.txt

    - name: Setup Cloudflare WARP Proxy (Bypass Azure ASN Block on IDX)
      continue-on-error: true
      run: |
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        sudo apt-get update && sudo apt-get install -y cloudflare-warp
        sudo warp-svc > /dev/null 2>&1 &
        sleep 2
        warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
        warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy || true
        warp-cli --accept-tos proxy port 40000 || warp-cli --accept-tos set-proxy-port 40000 || true
        warp-cli --accept-tos connect || true
        sleep 3

    - name: Run Stock Engine (Pipeline + Harvester)
      timeout-minutes: 350 # Strict step timeout: runner actively kills if step reaches 350 menit
      env:
        PYTHONUNBUFFERED: "1"
        IDX_PROXY_URL: "socks5h://127.0.0.1:40000"
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        TELE_BOT_DHIKSDHIKY: ${{ secrets.TELE_BOT_DHIKSDHIKY }}
        TELE_CHAT_ID_DHIKA: ${{ secrets.TELE_CHAT_ID_DHIKA }}
      run: |
        cd worker
        python -u run.py
