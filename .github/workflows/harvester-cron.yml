name: Glory Engine Harvester

on:
  schedule:
    # Berjalan tiap jam 11:17 UTC (18:17 WIB), dari Senin sampai Jumat (Menghindari load/delay di menit 0)
    - cron: '17 11 * * 1-5'
  workflow_dispatch: # Mengizinkan eksekusi manual via tab Actions

concurrency:
  group: glory-harvester
  cancel-in-progress: true

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    timeout-minutes: 200 # Timeout job total maksimal 3.3 jam
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r worker/requirements.txt
        
    - name: Run Stock Engine (Pipeline + Harvester)
      timeout-minutes: 180 # Strict step timeout: runner actively kills if step reaches 3 jam
      env:
        PYTHONUNBUFFERED: "1"
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        TELE_BOT_DHIKSDHIKY: ${{ secrets.TELE_BOT_DHIKSDHIKY }}
        TELE_CHAT_ID_DHIKA: ${{ secrets.TELE_CHAT_ID_DHIKA }}
      run: |
        cd worker
        python -u run.py
